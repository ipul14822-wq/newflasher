
name: Build Newflasher for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mingw-w64-i686 make wget vim-common

      - name: Build Windows executable
        run: |
          make newflasher.exe

      - name: Save executable
        uses: actions/upload-artifact@v4
        with:
          name: newflasher-windows
          path: newflasher.exe
